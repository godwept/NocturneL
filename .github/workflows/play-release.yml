name: Play release candidate

on:
  push:
    tags:
      - 'play/*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release tag and version
        id: version
        shell: bash
        run: |
          read -r VERSION_NAME VERSION_CODE <<< "$(./gradlew -q :app:printReleaseVersion)"
          mapfile -t PRIOR_TAGS < <(git tag --list 'play/*-*')
          bash .github/scripts/validate-release-version.sh \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REF_NAME" "${PRIOR_TAGS[@]}"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Require Play Store assets
        shell: bash
        run: |
          ASSET_ROOT="docs/play-store/listing/graphics"
          REQUIRED_ASSETS=(
            "icon.png"
            "feature-graphic.png"
            "phone/01-library.png"
            "phone/02-album.png"
            "phone/03-now-playing.png"
            "phone/04-queue.png"
            "tablet/01-library.png"
            "tablet/02-album.png"
            "tablet/03-now-playing.png"
            "tablet/04-queue.png"
          )
          for RELATIVE_PATH in "${REQUIRED_ASSETS[@]}"; do
            if [[ ! -f "$ASSET_ROOT/$RELATIVE_PATH" ]]; then
              echo "Missing required Play Store asset: $ASSET_ROOT/$RELATIVE_PATH" >&2
              exit 1
            fi
          done
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Validate terminal UI screenshots
        run: ./gradlew validateDebugScreenshotTest
      - name: Release lint
        run: ./gradlew lintRelease
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Build unsigned release bundle
        run: ./gradlew bundleRelease
      - name: Stage unsigned inputs
        shell: bash
        run: |
          mkdir -p release-inputs
          cp app/build/outputs/bundle/release/app-release.aab release-inputs/app-release.aab
          cp app/build/outputs/mapping/release/mapping.txt release-inputs/mapping.txt
      - name: Upload unsigned inputs
        uses: actions/upload-artifact@v4
        with:
          name: nocturnel-unsigned-${{ github.sha }}
          path: release-inputs/
          if-no-files-found: error
          retention-days: 1

  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run API ${{ matrix.api-level }} instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

  package:
    runs-on: ubuntu-latest
    needs: [quality, device-tests]
    environment: play-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturnel-unsigned-${{ github.sha }}
          path: release-inputs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require signing secrets
        shell: bash
        env:
          NOCTURNEL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOCTURNEL_UPLOAD_KEYSTORE_BASE64 }}
          NOCTURNEL_UPLOAD_KEY_ALIAS: ${{ secrets.NOCTURNEL_UPLOAD_KEY_ALIAS }}
          NOCTURNEL_UPLOAD_STORE_PASSWORD: ${{ secrets.NOCTURNEL_UPLOAD_STORE_PASSWORD }}
          NOCTURNEL_UPLOAD_KEY_PASSWORD: ${{ secrets.NOCTURNEL_UPLOAD_KEY_PASSWORD }}
        run: |
          : "${NOCTURNEL_UPLOAD_KEYSTORE_BASE64:?Missing NOCTURNEL_UPLOAD_KEYSTORE_BASE64}"
          : "${NOCTURNEL_UPLOAD_KEY_ALIAS:?Missing NOCTURNEL_UPLOAD_KEY_ALIAS}"
          : "${NOCTURNEL_UPLOAD_STORE_PASSWORD:?Missing NOCTURNEL_UPLOAD_STORE_PASSWORD}"
          : "${NOCTURNEL_UPLOAD_KEY_PASSWORD:?Missing NOCTURNEL_UPLOAD_KEY_PASSWORD}"
      - name: Download verified bundletool
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
      - name: Validate bundle and merged manifest
        shell: bash
        run: |
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=release-inputs/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle=release-inputs/app-release.aab \
            --module=base > release-inputs/merged-manifest.xml
          grep --quiet 'package="ca.stewark.nocturnel"' release-inputs/merged-manifest.xml
          grep --quiet 'android:minSdkVersion="31"' release-inputs/merged-manifest.xml
          grep --quiet 'android:targetSdkVersion="36"' release-inputs/merged-manifest.xml
          grep --quiet 'android:allowBackup="false"' release-inputs/merged-manifest.xml
          if grep --quiet 'android.permission.INTERNET' release-inputs/merged-manifest.xml; then
            echo 'Unexpected internet permission in merged release manifest' >&2
            exit 1
          fi
      - name: Sign and verify release bundle
        shell: bash
        env:
          NOCTURNEL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NOCTURNEL_UPLOAD_KEYSTORE_BASE64 }}
          NOCTURNEL_UPLOAD_KEY_ALIAS: ${{ secrets.NOCTURNEL_UPLOAD_KEY_ALIAS }}
          NOCTURNEL_UPLOAD_STORE_PASSWORD: ${{ secrets.NOCTURNEL_UPLOAD_STORE_PASSWORD }}
          NOCTURNEL_UPLOAD_KEY_PASSWORD: ${{ secrets.NOCTURNEL_UPLOAD_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          cp release-inputs/app-release.aab \
            "release-artifacts/nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab"
          printf '%s' "$NOCTURNEL_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nocturnel-upload.jks"
          jarsigner \
            -keystore "$RUNNER_TEMP/nocturnel-upload.jks" \
            -storepass:env NOCTURNEL_UPLOAD_STORE_PASSWORD \
            -keypass:env NOCTURNEL_UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "release-artifacts/nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab" \
            "$NOCTURNEL_UPLOAD_KEY_ALIAS"
          jarsigner -verify -strict -verbose -certs \
            -keystore "$RUNNER_TEMP/nocturnel-upload.jks" \
            -storepass:env NOCTURNEL_UPLOAD_STORE_PASSWORD \
            "release-artifacts/nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate \
            --bundle="release-artifacts/nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab"
          cp release-inputs/mapping.txt release-artifacts/mapping.txt
          cp release-inputs/merged-manifest.xml release-artifacts/merged-manifest.xml
          cd release-artifacts
          sha256sum "nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab" \
            > "nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}.aab.sha256"
      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: nocturnel-${{ needs.quality.outputs.version-name }}-${{ needs.quality.outputs.version-code }}-play-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nocturnel-upload.jks"
