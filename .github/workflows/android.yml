name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Refresh changed terminal UI screenshots
        run: |
          ./gradlew updateDebugScreenshotTest
          echo "RADAR_B64_BEGIN"
          base64 -w0 "app/src/screenshotTestDebug/reference/ca/stewark/nocturnel/ui/TerminalUiScreenshotTestKt/FullScreenRadarPreview_Full screen radar_a6b975a7_0.png"
          echo
          echo "RADAR_B64_END"
          echo "GRID_B64_BEGIN"
          base64 -w0 "app/src/screenshotTestDebug/reference/ca/stewark/nocturnel/ui/TerminalUiScreenshotTestKt/FullScreenGridPreview_Full screen grid_4959e21e_0.png"
          echo
          echo "GRID_B64_END"
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Lint release variant
        run: ./gradlew lintRelease
      - name: Assemble unsigned release bundle
        run: ./gradlew bundleRelease
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nocturnel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
